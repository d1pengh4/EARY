# 공통 위험 어휘 (도메인과 상관없이 늘 켜짐). 패턴은 공백을 지운 텍스트에 맞춘다. (§9.1)
signals:
  # 실제 검찰 사칭 녹음(2026-10-24 실기)에서 놓친 전형 표현 — 기관 자칭과 함께 "당신이 사건에 걸려 있다"
  - category: impersonation
    strength: 0.75
    patterns: ["사건.{0,15}(연루|관련|조사).{0,20}(개인정보|명의|통장|계좌|본인)", "(개인정보|명의|통장|계좌).{0,10}(도용|유출|나와|발견|연루)", "(검찰청|지검|경찰서)(으로|에)?.{0,8}출석", "공문(장)?.{0,15}(발부|발송).{0,25}(출석|못받|안받)", "특수(부|수사)에서", "녹취(로|가)?(진행|되고|됩니다)"]
  - category: secrecy
    strength: 0.8
    patterns: ["외부에(말|얘기)(씀)?하(시|지)면안", "(가족|아무)에게도말(씀)?하지", "비밀(로|유지)", "다른곳에(전화|연락)하지", "누구에게도말하지", "(은행|가족|경찰|주변|회사)(에|에게|한테)(는|도)?(따로)?(말|얘기)(씀)?하지", "제3자(에게|한테|에)?.{0,15}(알리|발설|누설|유포|말씀|얘기|공개)", "엠바고", "(언론|뉴스).{0,10}보도(가)?(안|되지)", "(발설|누설)(하시면|하면|하지)"]
  - category: time_pressure
    strength: 0.7
    patterns: ["오늘안에", "지금(바로|당장)", "지금.{0,6}(해주셔야|하셔야)", "시간이없", "즉시", "(\\d+)분안에"]
  - category: money_transfer
    strength: 0.9
    patterns: ["안전\\s?계좌", "안전한계좌", "계좌로(옮기|이체|보내|넣)", "(이체|송금|입금)(을)?(하셔야|해주셔야|하세요|해주세요|해줘|해야)", "돈(을|좀)?(보내|송금|부쳐)", "현금을?(인출|찾아)"]
  - category: credential_request
    strength: 0.9
    patterns: ["인증번호.{0,8}(불러|알려|말씀|입력)", "OTP", "신분증.{0,8}(사진|찍어|보내)", "카드\\s?번호.{0,8}(불러|알려|입력)", "비밀번호.{0,6}(불러|알려|말씀)", "보안카드"]
  - category: remote_app
    strength: 0.85
    patterns: ["앱을?(설치|깔아)", "원격(제어|지원)", "링크를?(눌러|클릭)"]
