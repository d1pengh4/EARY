  - { id: ask_contact, kind: ask, text: 다시 연락할 공식 번호를 물어보세요, why: 나중에 확인할 때 필요해요. }
  - { id: ask_cost, kind: ask, text: 비용이 드는지 물어보세요, why: 금액이 나오지 않았어요. }
