patterns:
  amount: "((?:\\d+(?:,\\d{3})*(?:만|천)?)+)원(정도|가량|쯤)?"   # "23만 4천원", "118,000원", "12만 원 정도"
  date: "(\\d{1,2})월(\\d{1,2})일|(다음|이번)주(중)?|(내일|모레)"   # "오늘"은 "오늘 안에"(시간 압박)와 겹쳐 잡음이 돼서 뺐다
